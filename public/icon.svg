<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="dGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bookBlue" x1="160" y1="310" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bookGreen" x1="256" y1="310" x2="350" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background for app icon safety -->
  <rect width="512" height="512" rx="108" fill="#0A192F" />

  <g transform="translate(46, 46) scale(0.82)">
    <!-- Top Right Arrow -->
    <path d="M 370 70 L 440 30 L 420 100 Z" fill="#10B981" />

    <!-- Main Bold "D" Shape -->
    <path d="M 90 40 
             L 280 40 
             C 380 40, 440 100, 440 210 
             C 440 320, 380 380, 280 380 
             L 90 380 
             Z" 
          fill="url(#dGrad)" />

    <!-- Inner Cutout / Counter of the "D" -->
    <path d="M 170 120 
             L 260 120 
             C 320 120, 360 155, 360 210 
             C 360 265, 320 300, 260 300 
             L 170 300 
             Z" 
          fill="#0A192F" />

    <!-- Graduation Cap Mortarboard inside the D -->
    <path d="M 256 140 L 325 175 L 256 210 L 187 175 Z" fill="#FFFFFF" />
    <path d="M 215 190 L 215 225 C 215 242, 297 242, 297 225 L 297 190 Z" fill="#E2E8F0" />
    <!-- Tassel -->
    <path d="M 312 182 L 318 220" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <circle cx="318" cy="223" r="4" fill="#10B981" />

    <!-- Open Book Pages below cap -->
    <!-- Left page (Blue) -->
    <path d="M 256 280 C 220 260, 180 270, 150 280 L 150 320 C 180 310, 220 300, 256 320 Z" fill="url(#bookBlue)" />
    <!-- Right page (Green) -->
    <path d="M 256 280 C 292 260, 332 270, 362 280 L 362 320 C 332 310, 292 300, 256 320 Z" fill="url(#bookGreen)" />
  </g>
</svg>
